# nrf/ is in the workspace for ESB, but oberon-psa-crypto/mbedtls-ncs aren't cloned.
# Disable NCS security stack so standard Zephyr mbedtls handles BLE crypto as before.
CONFIG_NRF_SECURITY=n

CONFIG_ZMK_POINTING=y

# RGB LED Widget - Battery level indicator
CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_BATTERY_SHOW_SELF=y
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=80
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_LOW=20

# Deep sleep mode
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
