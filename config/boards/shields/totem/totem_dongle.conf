CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=3

# Under test: ZMK PR #3382, applied via config/zephyr/patches.yml. Stops the dongle
# advertising itself to hosts as a pairable BLE keyboard - it reaches the PC over
# USB - while leaving BLE up for the split link to the halves and trackball.
CONFIG_ZMK_BLE_DISABLE_HOST_ADV=y

# Shadowed by config/totem.conf's CONFIG_ZMK_SLEEP=y, which is merged later, but
# harmless: activity.c gates deep sleep on !is_usb_power_present(), so a dongle on
# USB never sleeps regardless. Kept as a statement of intent.
CONFIG_ZMK_SLEEP=n

# Battery level over USB HID (ZMK PR #3458, applied as a patch - see
# config/zephyr/patches.yml). Emits a Power Device/Battery System HID report per
# keyboard part, report ID 0x04 + devicetree child index. The hidden dongle child
# is skipped, so the wire has 0x05 (peripheral 0), 0x06 (1) and 0x07 (2).
CONFIG_ZMK_BATTERY_REPORTING_USB=y

# High-resolution scrolling. Adds a Resolution Multiplier feature to the HID
# descriptor; the host then treats each scroll unit as 1/16 of a detent instead of
# a whole one, so scrolling is continuous rather than notched. Central-only Kconfig.
# The scroll divisor in the overlay was cut 32 -> 2 to keep the same overall speed
# at 16x the granularity.
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# Per-part reporting is mutually exclusive with the aggregate: battery_reporting.c
# only emits the individual reports when the lowest-charge rollup is off. Turning
# this off replaces the single "worst of all parts" number with one report per
# part. Read them with ./zmk-battery.py, since Linux < 7.1 registers only the
# first battery of a multi-battery HID device in /sys/class/power_supply.
CONFIG_ZMK_BATTERY_REPORTING_SPLIT_REPORT_LOWEST_CHARGE=n

# Pointer acceleration
# Input processors run on the central, so this belongs to the dongle - not the
# trackball peripheral. PRESET_CUSTOM is required: with any other preset the
# driver ignores every tuning property in the devicetree.
CONFIG_ZMK_INPUT_PROCESSOR_ACCELERATION=y
CONFIG_INPUT_PROCESSOR_ACCEL_LEVEL_STANDARD=y
CONFIG_INPUT_PROCESSOR_ACCEL_PRESET_CUSTOM=y

