patches:
  - path: zmk-3458-battery-reporting.patch
    sha256sum: 870b37b7585bc587fc7fa2c0970ae8b3c6691306286e6c5fc9310c33c2c22214
    module: zmk
    author: Lucas Zampieri
    email: lcasmz54@gmail.com
    date: 2026-08-01
    upstreamable: true
    merge-pr: https://github.com/zmkfirmware/zmk/pull/3458
    merge-status: false
    comments: >
      Squash of the four commits on ZMK PR #3458 (per-part HID battery reporting
      and charge status), which supersedes PR #2938 - its first two commits are
      genteure's original work. Rebased onto zmk main 6e2ef41e. Adds
      CONFIG_ZMK_BATTERY_REPORTING_USB, emitting one Power Device/Battery System
      HID report per keyboard part (report ID 0x04 + devicetree child index), read
      from /dev/hidraw by ./zmk-battery.py. Needed because stock ZMK reports
      battery only over the BLE Battery Service, which a USB-attached dongle
      cannot use. Note that Linux only registers every battery of a multi-battery
      HID device from 7.1 onward, so power_supply/upower see just the first one
      until then. Drop this patch once the PR merges - it rewrites the split BAS
      proxy, so expect conflicts with any upstream change in that area.
  - path: zmk-3382-disable-host-adv.patch
    sha256sum: f2c96b8b45abfd0dce3b0842f7678fd595ed5a835dad2fd80d94027104e8d6e0
    module: zmk
    author: lemon
    email: tuwki@qq.com
    date: 2026-06-06
    upstreamable: true
    merge-pr: https://github.com/zmkfirmware/zmk/pull/3382
    merge-status: false
    comments: >
      ZMK PR #3382 (open, unreviewed), adding CONFIG_ZMK_BLE_DISABLE_HOST_ADV so a
      USB dongle stops advertising itself as a pairable BLE HID keyboard while
      keeping BLE up for the split link. Enabled in totem_dongle.conf. Generated on
      top of the #3458 patch above because both touch app/Kconfig - this entry must
      stay second or it will not apply.
  - path: zmk-battery-no-host-wake.patch
    sha256sum: fa17e2a44ec1bb9b100aede84ff1915162d6c8e1f2e858d707d0e3be5b66a32f
    module: zmk
    author: Lukasz Chojnacki
    email: lukasz.chojnacki@robotec.ai
    date: 2026-08-15
    upstreamable: true
    merge-pr: https://github.com/zmkfirmware/zmk/pull/3458
    merge-status: false
    comments: >
      Local fix on top of PR #3458: battery HID reports must not wake a suspended
      host. zmk_usb_hid_send_report() answers USB_DC_SUSPEND with
      usb_wakeup_request(), so every 1% step - and every peripheral reporting 0 as
      it deep-sleeps - resumed the laptop. The PR guards the aggregate path against
      the disconnect case only (battery_reporting.c), and that guard does not cover
      per-part reporting, which is what this config uses. Worth sending upstream to
      #3458. Third in this list: it is generated on top of the two patches above.
