# Trackball-specific overrides.
#
# This file must live here, in the config dir, rather than in
# boards/shields/totem/. ZMK appends config-dir fragments after Zephyr has merged
# the shield-directory ones (see zmk/app/boards/post_boards_shields.cmake), and
# within that list config/<shield>.conf comes after config/<keyboard>.conf - so
# this is the only place a per-part value survives config/totem.conf.

# Deep sleep stays on, with the PMW3610 MOT line declared as the wakeup source
# in totem_trackball.overlay. Rolling the ball pulls MOT low, DETECT brings the
# nRF out of System OFF, and the reset button is no longer the only way back.
#
# This needs the waker arming added to the deep sleep path in zmk (activity.c ->
# zmk_pm_arm_wakeup_sources); upstream only armed wakers for soft-off, so plain
# CONFIG_ZMK_SLEEP=y powered off with nothing armed.

# 15 minutes, against the shared 30 in config/totem.conf. This was an hour back
# when the reset button was the only way out of deep sleep, so sleeping was
# something to postpone. Now that MOT wakes it, the ball being untouched for long
# stretches is a reason to sleep sooner rather than later, and the trackball idles
# more than either half does.
#
# The cost of a shorter timeout is paying the cold boot and BLE re-link more
# often - a System OFF exit is a reset, so the first flick after each sleep is
# still lost.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
