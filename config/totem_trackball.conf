# Trackball-specific overrides.
#
# This file must live here, in the config dir, rather than in
# boards/shields/totem/. ZMK appends config-dir fragments after Zephyr has merged
# the shield-directory ones (see zmk/app/boards/post_boards_shields.cmake), and
# within that list config/<shield>.conf comes after config/<keyboard>.conf - so
# this is the only place a per-part value survives config/totem.conf.

# One hour instead of the shared 30 minutes: the ball is often untouched for long
# stretches while the halves keep typing, and waking it costs a reconnect that
# shows up as a sluggish first movement.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
